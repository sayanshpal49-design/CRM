server.port=8080

# MySQL (use env vars in interviews)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/crm}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# For portfolio simplicity (interview demo-friendly).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=false

spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

# Optional Salesforce integration (basic query example)
app.salesforce.instance-url=${SALESFORCE_INSTANCE_URL:}
app.salesforce.access-token=${SALESFORCE_ACCESS_TOKEN:}
app.salesforce.api-version=${SALESFORCE_API_VERSION:59.0}

